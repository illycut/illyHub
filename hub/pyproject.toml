[project]
name = "illyhub-hub"
version = "0.1.0"
description = "illyHub hub service: unified HEOS + Sonos + Denon control on the LAN"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyheos>=1.0,<2",
    "soco>=0.30,<1",
    "httpx>=0.27",
    "anyio>=4.4",
    # aiohttp is required by soco.events_asyncio (not pulled in by soco itself).
    "aiohttp>=3.14.3",
    "pillow>=10.4",
    "tidalapi>=0.8,<1",
    # Upper bound is a deployment constraint, not a preference: cryptography>=43 publishes
    # arm64-only macOS wheels, and the hub Mac is an Intel MacBook Pro (PRD 6.1). 42.0.8 is
    # the newest release with a CPython x86_64 macOS wheel, so anything above it forces a
    # source build needing OpenSSL 3 + Rust on the deployment target.
    "cryptography>=42,<51",
    "ytmusicapi>=1.10,<2"

]

[project.scripts]
hub = "illyhub_hub.main:run"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/illyhub_hub"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-q"

[tool.coverage.run]
source = ["illyhub_hub"]
branch = false

[tool.coverage.report]
fail_under = 80
show_missing = true
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "\\.\\.\\."]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "N", "W"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501", "ASYNC109", "ASYNC110", "ASYNC240"]
