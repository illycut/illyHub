name: CI

on:
  push:
    branches: [main]
    paths:
      - "hub/**"
      - "app/**"
      - "ops/**"
      - ".github/workflows/**"
  pull_request:
    paths:
      - "hub/**"
      - "app/**"
      - "ops/**"
      - ".github/workflows/**"

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The fake hub writes art cache, history, vault and sync logs here; keep them out of the checkout.
  HUB_DATA_DIR: ${{ runner.temp }}/illyhub-data
  CI: "true"

jobs:
  hub:
    name: hub (ruff, pytest, coverage gate)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hub/uv.lock
      - name: Install Python 3.12 and dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Lint
        run: uv run ruff check src tests
      - name: Format check
        run: uv run ruff format --check src tests
      - name: Tests with coverage gate (fail_under in pyproject)
        run: uv run pytest -q --cov=illyhub_hub --cov-report=xml --cov-report=term
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: hub-coverage
          path: hub/coverage.xml
          if-no-files-found: ignore

  app:
    name: app (tsc, eslint, vitest, build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: Type check
        run: npx tsc --noEmit
      - name: Lint
        run: npx eslint .
      - name: Unit tests with coverage thresholds (vitest.config)
        run: npx vitest run --coverage
      - name: Static export
        run: npx next build
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: app-coverage
          path: app/coverage
          if-no-files-found: ignore

  e2e:
    name: e2e (Playwright, WebKit + Chromium, fake hub)
    runs-on: ubuntu-latest
    needs: [hub, app]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: hub/uv.lock
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: Install hub
        working-directory: hub
        run: |
          uv python install 3.12
          uv sync --frozen
      - name: Install app
        working-directory: app
        run: npm ci
      - name: Install browsers
        working-directory: app
        run: npx playwright install --with-deps webkit chromium
      # playwright.config.ts's webServer builds the export and starts the fake hub
      # (HUB_FAKE_* + HUB_AIRPLAY_ENABLED=1); CI=true disables reuseExistingServer.
      - name: Playwright
        working-directory: app
        run: npx playwright test
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-failure
          path: |
            app/playwright-report
            app/test-results
          if-no-files-found: ignore
          retention-days: 7
